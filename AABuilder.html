<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, user-scalable=no"/>
    <title>AABuilder</title>
	<link rel="stylesheet" type="text/css" href="style.css"/>
  </head>
  <body id="body" onload="main()">
    <div id="container" ondragstart="return false;">
      <textarea id="aacode" rows="2" ondrop="return false;" readonly style="left:0px; top:10px; font-size:15px;
       width:720px; resize:none; background-color:lightgray; position:absolute"></textarea>
      <div id="copyright" style="right:3px; bottom:2px; font-family: cursive;
       font-size: 8px; position: absolute">AABuilder © A.Sinyavskiy UZH</div>
      <div id="buttons" ondragstart="return false;">
        <img id="sw_replace" src="toolbar/replace_off.svg" class="sw but_dis" draggable="false"/>
        <img id="sw_remove" src="toolbar/remove_off.svg" class="sw but_dis" draggable="false"/>
        <img id="but_A" src="toolbar/A.svg" class="but" draggable="false" mydraggable="true"/>
        <img id="but_C" src="toolbar/C.svg" class="but but_dis" style="display:none" draggable="false"/>
        <img id="but_N" src="toolbar/N.svg" class="but but_dis" draggable="false"/>
        <img id="but_O" src="toolbar/O.svg" class="but but_dis" draggable="false"/>
        <img id="but_S" src="toolbar/S.svg" class="but but_dis" draggable="false"/>
        <img id="but_plus" src="toolbar/plus.svg" class="but but_dis" draggable="false"/>
        <img id="but_minus" src="toolbar/minus.svg" class="but but_dis" draggable="false"/>
        <img id="but_undo" src="toolbar/undo.svg" class="but but_undo but_dis" draggable="false"/>
        <img id="but_H" src="toolbar/H.svg" class="but but_H" draggable="false"/>
        <img id="but_2" src="toolbar/2.svg" class="but_23" draggable="false"/>
        <img id="but_3" src="toolbar/3.svg" class="but_23" draggable="false"/>
      </div>
      <svg id="svg">
      </svg>
      <div id="can" ondragstart="return false;">
      </div>
    </div>
    
    <script type="text/javascript">
      "use strict";
      function main() {
        let dragSource = null, lastTouch = null, lastTarget = null, ptDown = null, img = null, imgOffset = { x: 0, y: 0 };
        let preventClick = false;
        let counter = 0, tree = [], rings = [], code = "", history = [];
        let cur_ori, cur_seq, cur_fori, cur_fseq;
        let lock = false;
        let replace = false, remove = false;
        let enableinput = getUrlParam("enableinput", "no");
        let startSMILES = getUrlParam("startSMILES", "");
        let wts = {"O":2**44, "C":2**40, "S":2**38, "N":2**36, "H":2**24, "chrg":2**26, "s":0, "d":2**42};
        let icon, icon23, iconpm, marg, iscale = 1, bondlength = 70, bondstroke = 4;
        let svgns = "http://www.w3.org/2000/svg";
        let cont = document.getElementById("container");
        let aacode = document.getElementById("aacode");
        let can = document.getElementById("can");
        let svg = document.getElementById("svg");
        // let copy = document.getElementById("but_copy");
        let buta = document.getElementById("but_A");
        let butc = document.getElementById("but_C");
        let butn = document.getElementById("but_N");
        let buto = document.getElementById("but_O");
        let buts = document.getElementById("but_S");
        let plus = document.getElementById("but_plus");
        let minus = document.getElementById("but_minus");
        let undo = document.getElementById("but_undo");
        let swrep = document.getElementById("sw_replace");
        let swrem = document.getElementById("sw_remove");
        
        document.addEventListener("touchstart", ftouchstart, {passive: false});
        document.addEventListener("touchmove", ftouchmove, {passive: false});
        document.addEventListener("touchend", ftouchend);
        document.addEventListener("touchcancel", ftouchend);
        document.addEventListener("mousedown", ftouchstart, {passive: false});
        document.addEventListener("mousemove", ftouchmove, {passive: false});
        document.addEventListener("mouseup", ftouchend);

        rescaleAll();
        history.push(new Snapshot());
        window.addEventListener("resize", debounce(rescaleAll));
        aacode.addEventListener("input", debounce(aacode_input));
        // copy.addEventListener("click", copy_click);
        undo.addEventListener("click", undo_click);
        swrep.addEventListener("click", replace_switch);
        swrem.addEventListener("click", remove_switch);
        if (enableinput === "yes") { aacode.removeAttribute("readonly"); }
        aacode.value = startSMILES;
        if (aacode.value !== "") { aacode.dispatchEvent(new Event("input")); }

        function getUrlParam(parameter, defaultvalue){
          var urlparameter = defaultvalue;
          if(window.location.href.indexOf(parameter) > -1) {
              urlparameter = getUrlVars()[parameter];
          }
          return urlparameter;
        }
        function getUrlVars() {
          var vars = {};
          window.location.href.replace(/[?&]+([^=&]+)=([^&]*)/gi, function(m,key,value) {
              vars[key] = decodeURI(value);
          });
          return vars;
        }

        function getang(x1, y1, x2, y2) {
          return -Math.atan2(y2-y1, x2-x1);
        }
        function getdx(x1, y1, x2, y2, dist, da = 0) {
          let a = getang(x1, y1, x2, y2) + da;
          return Math.cos(a)*dist;
        }
        function getdy(x1, y1, x2, y2, dist, da = 0) {
          let a = getang(x1, y1, x2, y2) + da;
          return -Math.sin(a)*dist;
        }
        function round(inp, prec = 1000) {
          return Math.round(inp*1000)/1000;
        }
        function getdbp(x1, y1, x2, y2) {
          let dx = -getdy(x1, y1, x2, y2, bondstroke);
          let dy = getdx(x1, y1, x2, y2, bondstroke);
          return "M " + round(x1+dx).toString() + " " + round(y1+dy).toString() +
                " L " + round(x2+dx).toString() + " " + round(y2+dy).toString() +
                " M " + round(x1-dx).toString() + " " + round(y1-dy).toString() +
                " L " + round(x2-dx).toString() + " " + round(y2-dy).toString();
        }
        function togglebond(e) {
          if (!remove) {
            let atb = tree[Number(e.target.id.split('_')[1])].bonds;
            let atc = tree[Number(e.target.id.split('_')[1])].children;
            let child = Number(e.target.id.split('_')[2]);
            if (atb[atc.indexOf(child)] === "s") { atb[atc.indexOf(child)] = "d"; }
            else if (atb[atc.indexOf(child)] === "d") { atb[atc.indexOf(child)] = "s"; }
            recalcclasses();
            code = getcode(0, "s");
            aacode.value = code;
            rescaleAll();
            history.push(new Snapshot());
            undo.classList.remove("but_dis");
          }
        }
        function removecharge(e) {
          let at = Number(e.target.id.split('_')[1]);
          tree[at].chrg = 0;
          can.removeChild(e.target);
          recalcclasses();
          code = getcode(0, "s");
          aacode.value = code;
          rescaleAll();
          history.push(new Snapshot());
          undo.classList.remove("but_dis");
        }
        function drawcharges() {
          let item;
          for (let i = 0; i < counter; i += 1) {
            if (tree[i].chrg > 0) {
              item = document.getElementById("charge_" + i);
              item.style["width"] = iconpm + "px";
              item.style["height"] = iconpm + "px";
              item.style["margin"] = 0 + "px";
              item.style["left"] = tree[i].x + icon - marg + "px";
              item.style["top"] = tree[i].y - icon + marg/2 + iconpm + "px";
              item.style["display"] = "inline";
            }
          }
        }
        function toggleHremoveside(e) {
          if (preventClick) { preventClick = false; return; }
          let at = Number(e.target.id.split('_')[1]);
          if (remove) {
            let item;
            let side = tree[at].side;
            if (side >= 0) {
              let toremove = [];
              let newind = [];
              let ringrm = -1;
              // delete atoms and fill index arrays
              for (let i = 0; i < counter; i += 1) {
                if (tree[i].main < 0 && tree[i].side === side) {
                  if (ringrm < 0) { ringrm = isinring(i); }
                  toremove.push(i);
                  delete tree[i];
                  newind.push(-1);
                  item = document.getElementById("elem_" + i);
                  can.removeChild(item);
                  item = document.getElementById("charge_" + i);
                  if (item) { can.removeChild(item); }
                  item = document.getElementById("H_" + i);
                  if (item) { can.removeChild(item); }
                  item = document.getElementById("Hn_" + i);
                  if (item) { can.removeChild(item); }
                } else {
                  newind.push(i-toremove.length);
                  item = document.getElementById("elem_" + i);
                  item.id = "elem_" + (i-toremove.length);
                  item = document.getElementById("charge_" + i);
                  if (item) { item.id = "charge_" + (i-toremove.length); }
                  item = document.getElementById("H_" + i);
                  if (item) { item.id = "H_" + (i-toremove.length); }
                  item = document.getElementById("Hn_" + i);
                  if (item) { item.id = "Hn_" + (i-toremove.length); }
                }
              }
              // delete ring
              let iN;
              if (ringrm >= 0) {
                iN = newind[rings[ringrm].ori];
                rings.splice(ringrm,1);
              }
              // shift remaining rings
              for (let i = 0; i < rings.length; i += 1) {
                let seq = rings[i].seq;
                let fseq = rings[i].fseq;
                rings[i].ori = newind[rings[i].ori];
                for (let j = 0; j < seq.length; j += 1) {
                  seq[j] = newind[seq[j]];
                }
                if (rings[i].fori >= 0) { 
                  rings[i].fori = newind[rings[i].fori];
                  for (let j = 0; j < fseq.length; j += 1) {
                    fseq[j] = newind[fseq[j]];
                  }
                }
              }
              // shift bonds of remaining atoms
              tree = tree.filter(function(element){ return element !== undefined; });
              counter = tree.length;
              for (let i = 0; i < counter; i += 1) {
                tree[i].parent = newind[tree[i].parent];
                for (let k = 0; k < tree[i].children.length; k += 1) {
                  if (toremove.includes(tree[i].children[k])) {
                    delete tree[i].children[k];
                    delete tree[i].bonds[k];
                  } else {
                    tree[i].children[k] = newind[tree[i].children[k]];
                  }
                }
                tree[i].children = tree[i].children.filter(function(element){ return element !== undefined; });
                tree[i].bonds = tree[i].bonds.filter(function(element){ return element !== undefined; });
              }
              tree[0].parent = -1;
              tree[0].maxch = 3;
              for (let i = 1; i < counter; i += 1) {
                if (tree[i].main === side && tree[i].side === side) {
                  tree[i].maxch = 2;
                  if (tree[i].parent < 0) {
                    tree[i].parent = iN;
                    let k = tree[i].children.indexOf(iN);
                    if (k >= 0) {
                      tree[i].children.splice(k,1);
                      tree[iN].children.push(i);
                      tree[iN].bonds.push(tree[i].bonds.splice(k,1)[0]);
                    }
                  }
                }
              }
            }
          } else {
            tree[at].nH = (tree[at].nH+1)%4;
          }
          recalcclasses();
          code = getcode(0, "s");
          aacode.value = code;
          rescaleAll();
          history.push(new Snapshot());
          undo.classList.remove("but_dis");
        }
        function drawHs() {
          let item;
          let nodeCopy;
          for (let i = 0; i < counter; i += 1) {
            item = document.getElementById("H_" + i);
            if (item) { can.removeChild(item); }
            item = document.getElementById("Hn_" + i);
            if (item) { can.removeChild(item); }
          }
          for (let i = 0; i < counter; i += 1) {
            if (tree[i].nH > 0) {
              nodeCopy = document.getElementById("but_H").cloneNode(true);
              nodeCopy.id = "H_" + i;
              nodeCopy.classList.add("elem_H23");
              can.appendChild(nodeCopy);
            }
            if (tree[i].nH > 1) {
              nodeCopy = document.getElementById("but_" + tree[i].nH).cloneNode(true);
              nodeCopy.id = "Hn_" + i;
              nodeCopy.classList.add("elem_H23");
              can.appendChild(nodeCopy);
            }
          }
          for (let i = 0; i < counter; i += 1) {
            item = document.getElementById("H_" + i);
            if (item) {
              let x, y, xn, yn;
              x = tree[i].x + icon;
              y = tree[i].y + marg;
              xn = tree[i].x + icon + icon23;
              yn = tree[i].y + icon23;
              let right = collision(x, y, icon, icon, xn, yn);
              if (right[0] > 0) {
                x = tree[i].x - icon + 3/2*marg;
                y = tree[i].y + marg;
                xn = tree[i].x;
                yn = tree[i].y + icon23;
                let left = collision(x, y, icon, icon, xn, yn);
                if (left[0] > 0) {
                  x = tree[i].x + marg;
                  y = tree[i].y + icon;
                  xn = tree[i].x + icon - marg/2;
                  yn = tree[i].y + icon + icon23 - marg;
                  let bottom = collision(x, y, icon, icon, xn, yn);
                  if (bottom[0] > 0) {
                    x = tree[i].x + marg;
                    y = tree[i].y - icon + 2*marg;
                    xn = tree[i].x + icon - marg/2;
                    yn = tree[i].y - icon + icon23 + marg;
                    let top = collision(x, y, icon, icon, xn, yn);
                    if (top[0] > 0) {
                      if (right[0] <= left[0] && right[0] <= bottom[0] && right[0] <= top[0]) {
                        x = right[1];
                        y = right[2];
                        xn = right[3];
                        yn = right[4];
                      } else if (left[0] <= right[0] && left[0] <= bottom[0] && left[0] <= top[0]) {
                        x = left[1];
                        y = left[2];
                        xn = left[3];
                        yn = left[4];
                      } else if (bottom[0] <= right[0] && bottom[0] <= left[0] && bottom[0] <= top[0]) {
                        x = bottom[1];
                        y = bottom[2];
                        xn = bottom[3];
                        yn = bottom[4];
                      } else if (top[0] <= right[0] && top[0] <= left[0] && top[0] <= bottom[0]) {
                        x = top[1];
                        y = top[2];
                        xn = top[3];
                        yn = top[4];
                      }
                    }
                  }
                }
              }
              item.style["left"] = x + "px";
              item.style["top"] = y + "px";
              item.style["display"] = "inline";
              item = document.getElementById("Hn_" + i);
              if (item) {
                item.style["left"] = xn + "px";
                item.style["top"] = yn + "px";
                item.style["display"] = "inline";
              }
            }
          }
        }
        function collision(x, y, w, h, xn, yn) {
          let overlap = 0;
          document.querySelectorAll("line, path").forEach(item => {
            let box = item.getBBox();
            let ow, oh;
            if (x <= box.x) { ow = Math.max(0, x+w - box.x); }
            else { ow = Math.max(0, box.x+box.width - x); }
            if (y <= box.y) { oh = Math.max(0, y+h - box.y); }
            else { oh = Math.max(0, box.y+box.height - y); }
            overlap += ow*oh;
          })
          return [overlap, x, y, xn, yn];
        }
        function updatexy() {
          let minx = 0, miny = 0;
          let par, gpar, gp1, gp2, nc, ic, da, inr, seq, ori, pinr, pinfr;
          tree[0].x = 0;
          tree[0].y = 0;
          // first proline ring
          inr = isinring(0);
          if (inr >= 0 && 0 === rings[inr].ori) {
            seq = rings[inr].seq;
            tree[seq[0]].x = getdx(1, 0, 0, 0, bondlength*5/6, 0);
            tree[seq[0]].y = getdy(1, 0, 0, 0, bondlength*5/6, 0);
            da = Math.PI - (seq.length-1)/(seq.length+1)*Math.PI;
            for (let j = 1; j < seq.length; j += 1) {
              if (j === 1) { par = tree[0]; }
              else { par = tree[seq[j-2]]; }
              tree[seq[j]].x = tree[seq[j-1]].x + getdx(par.x, par.y, tree[seq[j-1]].x, tree[seq[j-1]].y, bondlength*5/6, da);
              tree[seq[j]].y = tree[seq[j-1]].y + getdy(par.x, par.y, tree[seq[j-1]].x, tree[seq[j-1]].y, bondlength*5/6, da);
            }
            if (rings[inr].fori >= 0) {
              seq = rings[inr].fseq;
              da = Math.PI - (seq.length-1)/(seq.length+1)*Math.PI;
              par = tree[seq[seq.length-1]];
              tree[seq[0]].x = tree[rings[inr].fori].x + getdx(par.x, par.y, tree[rings[inr].fori].x, tree[rings[inr].fori].y, bondlength*5/6, da);
              tree[seq[0]].y = tree[rings[inr].fori].y + getdy(par.x, par.y, tree[rings[inr].fori].x, tree[rings[inr].fori].y, bondlength*5/6, da);
              for (let j = 1; j < seq.length-1; j += 1) {
                if (j === 1) { par = tree[rings[inr].fori]; }
                else { par = tree[seq[j-2]]; }
                tree[seq[j]].x = tree[seq[j-1]].x + getdx(par.x, par.y, tree[seq[j-1]].x, tree[seq[j-1]].y, bondlength*5/6, da);
                tree[seq[j]].y = tree[seq[j-1]].y + getdy(par.x, par.y, tree[seq[j-1]].x, tree[seq[j-1]].y, bondlength*5/6, da);
              }
            }
          }
          for (let i = 1; i < counter; i += 1) {
            inr = isinring(i);
            if (inr >= 0 && i !== rings[inr].ori) { continue; }
            if (isinfring(i) >= 0) { continue; }
            par = tree[tree[i].parent];
            gpar = tree[par.parent];
            nc = par.children.length;
            ic = par.children.indexOf(i);
            if (par.parent < 0) {
              if (isinring(0) < 0) {
                if (nc < 3) {
                  if (ic === 0) {
                    tree[i].x = par.x - bondlength;
                    tree[i].y = par.y;
                  } else if (ic === 1) {
                    tree[i].x = par.x + bondlength;
                    tree[i].y = par.y;
                  }
                } else if (nc === 3) {
                  if (ic === 0) {
                    tree[i].x = par.x - bondlength;
                    tree[i].y = par.y;
                  } else if (ic === 1) {
                    tree[i].x = par.x;
                    tree[i].y = par.y + bondlength;
                  } else if (ic === 2) {
                    tree[i].x = par.x + bondlength;
                    tree[i].y = par.y;
                  }
                }
              } else {
                tree[i].x = par.x + bondlength;
                tree[i].y = par.y;
              }
            } else {
              pinr = isinring(tree[i].parent);
              pinfr = isinfring(tree[i].parent);
              if (pinr >= 0 || pinfr >= 0) {
                if (par.sym === "C" && par.main >= 0 && par.side >= 0) {
                  tree[i].x = par.x + getdx(tree[rings[pinr].ori].x, tree[rings[pinr].ori].y, par.x, par.y, bondlength);
                  tree[i].y = par.y + getdy(tree[rings[pinr].ori].x, tree[rings[pinr].ori].y, par.x, par.y, bondlength);
                } else {
                  if (pinr >= 0) {
                    seq = rings[pinr].seq.slice();
                    ori = rings[pinr].ori;
                  } else if (pinfr >= 0) {
                    seq = rings[pinfr].fseq.slice();
                    ori = rings[pinfr].fori;
                  }
                  seq.unshift(ori);
                  seq.push(ori);
                  if (ori === tree[i].parent) {
                    gp1 = tree[seq[1]];
                    gp2 = tree[seq[seq.length-2]];
                  } else {
                    gp1 = tree[seq[seq.indexOf(tree[i].parent)-1]];
                    gp2 = tree[seq[seq.indexOf(tree[i].parent)+1]];
                  }
                  tree[i].x = par.x + getdx((gp1.x + gp2.x)/2, (gp1.y + gp2.y)/2, par.x, par.y, bondlength, 0);
                  tree[i].y = par.y + getdy((gp1.x + gp2.x)/2, (gp1.y + gp2.y)/2, par.x, par.y, bondlength, 0);
                }
              } else {
                if (par.sym === "C" && par.main >= 0 && par.side < 0) {
                  da = ic*Math.PI/2;
                  tree[i].x = par.x + getdx(gpar.x, gpar.y, par.x, par.y, bondlength, da);
                  tree[i].y = par.y + getdy(gpar.x, gpar.y, par.x, par.y, bondlength, da);
                } else if (par.sym === "N" && par.main >= 0 && par.side >= 0) {
                  if (nc === 1) {
                    tree[i].x = par.x + getdx(gpar.x, gpar.y, par.x, par.y, bondlength);
                    tree[i].y = par.y + getdy(gpar.x, gpar.y, par.x, par.y, bondlength);
                  } else if (nc === 2) {
                    da = (ic-1)*Math.PI/2;
                    tree[i].x = par.x + getdx(gpar.x, gpar.y, par.x, par.y, bondlength, da);
                    tree[i].y = par.y + getdy(gpar.x, gpar.y, par.x, par.y, bondlength, da);
                  }
                } else if (par.sym === "C" && par.main >= 0 && par.side >= 0) {
                  if (nc === 1) {
                    tree[i].x = par.x + getdx(gpar.x, gpar.y, par.x, par.y, bondlength);
                    tree[i].y = par.y + getdy(gpar.x, gpar.y, par.x, par.y, bondlength);
                  } else if (nc === 2) {
                    da = (ic-1)*Math.PI/2;
                    tree[i].x = par.x + getdx(gpar.x, gpar.y, par.x, par.y, bondlength, da);
                    tree[i].y = par.y + getdy(gpar.x, gpar.y, par.x, par.y, bondlength, da);
                  }
                } else {
                  if (nc === 1) {
                    tree[i].x = par.x + getdx(gpar.x, gpar.y, par.x, par.y, bondlength);
                    tree[i].y = par.y + getdy(gpar.x, gpar.y, par.x, par.y, bondlength);
                  } else if (nc === 2) {
                    da = (2*ic - 1)*Math.PI/4;
                    tree[i].x = par.x + getdx(gpar.x, gpar.y, par.x, par.y, bondlength, da);
                    tree[i].y = par.y + getdy(gpar.x, gpar.y, par.x, par.y, bondlength, da);
                  }
                }
              }
            }
            if (tree[i].main >= 0 && tree[i].cls >= -(2**49)) { tree[i].x += bondlength*1/4; }
            if (inr >= 0 && i === rings[inr].ori) {
              if (tree[i].sym === "N" && tree[i].main >= 0) {
                seq = rings[inr].seq;
                da = Math.PI - (seq.length-1)/(seq.length+1)*Math.PI;
                tree[seq[0]].x = tree[i].x + getdx(1, 0, 0, 0, bondlength*5/6, da);
                tree[seq[0]].y = tree[i].y + getdy(1, 0, 0, 0, bondlength*5/6, da);
                da = Math.PI - (seq.length-1)/(seq.length+1)*Math.PI;
                for (let j = 1; j < seq.length; j += 1) {
                  if (j === 1) { par = tree[i]; }
                  else { par = tree[seq[j-2]]; }

        function getcode(index, sd, closing = false) {
          let total = "";
          let inr, infr, seq, fseq, e1, e2;
          let closefring = false;
          if (tree.length === 0) { return ""; }
          if (sd === "d" && !closing) { total += "="; }
          total += "[" + tree[index].sym;
          if (tree[index].nH > 0)
          {
            total += "H";
            if (tree[index].nH > 1) { total += tree[index].nH; }
          }
          if (tree[index].chrg === 1) { total += "-"; }
          if (tree[index].chrg === 2) { total += "+"; }
          total += "]";
          inr = isinring(index);
          infr = isinfring(index);
          if (inr < 0 && infr < 0) {
            for (let j = 0; j < tree[index].children.length; j += 1) {
              if (j < tree[index].children.length-1) { total +=  "("; }
              total += getcode(tree[index].children[j], tree[index].bonds[j]);
              if (j < tree[index].children.length-1) { total +=  ")"; }
            }
          } else if (infr >= 0) {
          } else if (index === rings[inr].ori) {
            // first Ca may be origin and have nonring children
            if (index === 0) {
              for (let k = 0; k < tree[0].children.length; k += 1) {
                if (isinring(tree[0].children[k]) < 0) {
                  total += "(" + getcode(tree[0].children[k], tree[0].bonds[k]) + ")";
                }
              }
            }
            seq = rings[inr].seq.slice();
            seq.unshift(index);
            seq.push(index);
            total += (tree[rings[inr].ori].side+1).toString();
            for (let j = 1; j < seq.length-1; j += 1) {
              e1 = tree[seq[j]].children.indexOf(seq[j-1]);
              e2 = tree[seq[j-1]].children.indexOf(seq[j]);
              if (e1 >= 0) { total += getcode(seq[j], tree[seq[j]].bonds[e1], closefring); }
              else if (e2 >= 0) { total += getcode(seq[j], tree[seq[j-1]].bonds[e2], closefring); }
              for (let k = 0; k < tree[seq[j]].children.length; k += 1) {
                if (isinring(tree[seq[j]].children[k]) < 0 && isinfring(tree[seq[j]].children[k]) < 0) {
                  total += "(" + getcode(tree[seq[j]].children[k], tree[seq[j]].bonds[k]) + ")";
                }
              }
              if (closefring) {
                total += (tree[rings[inr].ori].side+2).toString();
                closefring = false;
              }
              if (seq[j] === rings[inr].fori) {
                fseq = rings[inr].fseq.slice();
                fseq.unshift(rings[inr].fori);
                total += (tree[rings[inr].ori].side+2).toString();
                for (let jj = 1; jj < fseq.length-1; jj += 1) {
                  e1 = tree[fseq[jj]].children.indexOf(fseq[jj-1]);
                  e2 = tree[fseq[jj-1]].children.indexOf(fseq[jj]);
                  if (e1 >= 0) { total += getcode(fseq[jj], tree[fseq[jj]].bonds[e1]); }
                  else if (e2 >= 0) { total += getcode(fseq[jj], tree[fseq[jj-1]].bonds[e2]); }
                  for (let kk = 0; kk < tree[fseq[jj]].children.length; kk += 1) {
                    if (isinring(tree[fseq[jj]].children[kk]) < 0 && isinfring(tree[fseq[jj]].children[kk]) < 0) {
                      total += "(" + getcode(tree[fseq[jj]].children[kk], tree[fseq[jj]].bonds[kk]) + ")";
                    }
                  }
                }
                e1 = tree[fseq[fseq.length-1]].children.indexOf(fseq[fseq.length-2]);
                e2 = tree[fseq[fseq.length-2]].children.indexOf(fseq[fseq.length-1]);
                if (e1 >= 0) {
                  if (tree[fseq[fseq.length-1]].bonds[e1] === "d") { total += "="; }
                } else if (e2 >= 0) {
                  if (tree[fseq[fseq.length-2]].bonds[e2] === "d") { total += "="; }
                }
                closefring = true;
              }
            }
            e1 = tree[seq[seq.length-1]].children.indexOf(seq[seq.length-2]);
            e2 = tree[seq[seq.length-2]].children.indexOf(seq[seq.length-1]);
            if (e1 >= 0) {
              if (tree[seq[seq.length-1]].bonds[e1] === "d") { total += "="; }
            } else if (e2 >= 0) {
              if (tree[seq[seq.length-2]].bonds[e2] === "d") { total += "="; }
            }
            total += (tree[rings[inr].ori].side+1).toString();
          }
          if (sd === "d" && closing) { total += "="; }
          return total;
        }
        
        function readcode(str, parent) {
          let par = parent;
          let i = 0, j, k;
          let ch;
          let nH, chrg;
          let openring = [];
          while (i < str.length) {
            ch = str.charAt(i);
            if (ch === "[") {
              j = 2;
              nH = 0;
              chrg = 0;
              while ((i + j) < str.length) {
                ch = str.charAt(i + j);
                j += 1;
                if (ch === "]") { break; }
                if (ch === "H") { nH = 1; }
                if (ch.match(/[1-3]{1}/)) { nH += Number(ch)-1; }
                if (ch === "-") { chrg = 1; }
                if (ch === "+") { chrg = 2; }
              }
              ch = str.charAt(i + 1);
              if (ch.match(/C|N|O|S/)) {
                if (par < 0) { tree.push(new Elem(3, 0, 0, "C", nH, chrg, [], [], par, 2**48)); }
                else {
                  tree.push(new Elem(2, -1, -1, ch, nH, chrg, [], [], par, 0));
                  tree[par].children.push(counter);
                  ch = str.charAt(i - 1);
                  if (ch === "=") { tree[par].bonds.push("d"); }
                  else { tree[par].bonds.push("s"); }
                }
                par = counter;
                counter += 1;
                recalcclasses(true);
              }
              if (openring.length === 1) { rings[rings.length-1].seq.push(par); }
              if (openring.length === 2) { rings[rings.length-1].fseq.push(par); }
              i += j - 1;
            } else if (ch === "(") {
              j = i + 1;
              k = 1;
              while (k > 0 && j < str.length) {
                ch = str.charAt(j);
                j += 1;
                if (ch === "(") { k += 1; }
                else if (ch === ")") { k -= 1; }
              }
              readcode(str.slice(i + 1, j - 1), par);
              i = j - 1;
            } else if (ch.match(/[0-9]{1}/)) {
              if (openring.length === 0) {
                rings.push(new Ring(-1, par, [], -1, []));
                tree[par].maxch -= 1;
                openring.push([par, ch]);
              } else if (openring.length === 1) {
                if (ch === openring[0][1]) {
                  tree[par].children.push(openring.pop()[0]);
                  ch = str.charAt(i - 1);
                  if (ch === "=") { tree[par].bonds.push("d"); }
                  else { tree[par].bonds.push("s"); }
                } else {
                  rings[rings.length-1].fori = par;
                  tree[par].maxch -= 1;
                  openring.push([par, ch]);
                }
              } else if (openring.length === 2) {
                rings[rings.length-1].seq.push(par);
                tree[par].children.push(openring.pop()[0]);
                ch = str.charAt(i - 1);
                if (ch === "=") { tree[par].bonds.push("d"); }
                else { tree[par].bonds.push("s"); }
              }
            }
            i += 1;
          }
        }

            history.pop();
            if (history.length === 1) { undo.classList.add("but_dis"); }
            let snap = history[history.length-1];
            cont.removeChild(can);
            const domparser = new DOMParser();
            can = domparser.parseFromString(snap.can, "text/html").body.firstElementChild;
            cont.appendChild(can);
            counter = snap.counter;
            tree = JSON.parse(snap.tree);
            rings = JSON.parse(snap.rings);
            code = snap.code;
            aacode.value = code;
            for (let i = 0; i < counter; i += 1) {
              item = document.getElementById("elem_" + i);
              elem_addevents(item);
              if (tree[i].chrg > 0) {
                item = document.getElementById("charge_" + i);
                item.addEventListener("click", removecharge);
              }
            }
            while (svg.lastElementChild) {
              svg.removeChild(svg.lastElementChild);
            }
            rescaleAll();
            if (aacode.value === "") {
              butc.style["display"] = "none";
              buta.style["display"] = "inline";
              deactivate_buts();
              can.style["pointer-events"] = "auto";
            } else {
              buta.style["display"] = "none";
              butc.style["display"] = "inline";
              activate_buts();
              can.style["pointer-events"] = "none";
            }
            let anysides = false;
            for (let i = 0; i < counter; i += 1) {
              if (tree[i].main < 0 && tree[i].side >= 0) { anysides = true; break; }
            }
            if (anysides) { activate_switches(); }
            else { deactivate_switches(); }
            e.target.classList.add("shadow");
            setTimeout(() => { e.target.classList.remove("shadow"); }, 500);
          }
        }

        function activate_switches() {
          swrep.classList.remove("but_dis");
          swrem.classList.remove("but_dis");
        }
        function deactivate_switches() {
          if (replace) {
            replace = false;
            swrep.setAttribute("src", "toolbar/replace_off.svg");
            swrep.classList.remove("yellowshadow");
          }
          if (remove) {
            remove = false;
            activate_buts();
            swrem.setAttribute("src", "toolbar/remove_off.svg");
            swrem.classList.remove("redshadow");
          }
          swrep.classList.add("but_dis");
          swrem.classList.add("but_dis");
        }
        function activate_buts() {
          butc.classList.remove("but_dis");
          butn.classList.remove("but_dis");
          buto.classList.remove("but_dis");
          buts.classList.remove("but_dis");
          plus.classList.remove("but_dis");
          minus.classList.remove("but_dis");
          butc.setAttribute("mydraggable", "true");
          butn.setAttribute("mydraggable", "true");
          buto.setAttribute("mydraggable", "true");
          buts.setAttribute("mydraggable", "true");
          plus.setAttribute("mydraggable", "true");
          minus.setAttribute("mydraggable", "true");
        }
        function deactivate_buts() {
          butc.classList.add("but_dis");
          butn.classList.add("but_dis");
          buto.classList.add("but_dis");
          buts.classList.add("but_dis");
          plus.classList.add("but_dis");
          minus.classList.add("but_dis");
          butc.setAttribute("mydraggable", "false");
          butn.setAttribute("mydraggable", "false");
          buto.setAttribute("mydraggable", "false");
          buts.setAttribute("mydraggable", "false");
          plus.setAttribute("mydraggable", "false");
          minus.setAttribute("mydraggable", "false");
        }
        function debounce(func, t=200) {
          let timer;
          return (...args) => { clearTimeout(timer);
            timer = setTimeout(() => { func(...args); }, t);
          }
        }
        /** @constructor */
        function Elem(maxch, main, side, sym, nH, chrg, children, bonds, parent, cls) {
          this.maxch = maxch;
          this.main = main;
          this.side = side;
          this.sym = sym;
          this.nH = nH;
          this.chrg = chrg;
          this.children = children;
          this.bonds = bonds;
          this.parent = parent;
          this.cls = cls;
          this.x = 0;
          this.y = 0;
        }
        /** @constructor */
        function Ring(side, ori, seq, fori, fseq) {
          this.ori = ori;
          this.seq = seq;
          this.fori = fori;
          this.fseq = fseq;
        }
        /** @constructor */
        function Snapshot() {
          this.can = can.outerHTML;
          this.counter = counter;
          this.tree = JSON.stringify(tree);
          this.rings = JSON.stringify(rings);
          this.code = code.slice();
        }
        function pointFrom(e, page = false, touch = true) {
          if (touch) {
            const touch = e.touches[0];
            return {
              x: page ? touch.pageX : touch.clientX,
              y: page ? touch.pageY : touch.clientY
            };
          } else {
            return {
              x: page ? e.pageX : e.clientX,
              y: page ? e.pageY : e.clientY
            };
          }
        }
        function copyStyle(src, dst) {
          removeTroublesomeAttributes(dst);
          if (src instanceof HTMLCanvasElement) {
            let cDst = dst;
            cDst.width = src.width;
            cDst.height = src.height;
            cDst.getContext("2d").drawImage(src, 0, 0);
          }
          copyComputedStyles(src, dst);
          dst.style.pointerEvents = "none";
          for (let i = 0; i < src.children.length; i++) {
            copyStyle(src.children[i], dst.children[i]);
          }
        }
        function copyComputedStyles(src, dst) {
          let cs = getComputedStyle(src);
          if (cs) {
            for (let key of cs) {
              if (key.includes("transition")) { continue; }
              if (key.includes("animation")) { continue; }
              dst.style[key] = cs[key];
            }
          }
          Object.keys(dst.dataset).forEach((key) => delete dst.dataset[key]);
        }
        function removeTroublesomeAttributes(dst) {
          ["id", "class", "style", "draggable", "mydraggable"].forEach(function(att) {
            dst.removeAttribute(att);
          });
        }
        function shouldHandle(e, touch = true) {
          if (touch) { return e && !e.defaultPrevented && e.touches && e.touches.length < 2; }
          else { return e && !e.defaultPrevented && e.button === 0 && e.buttons <= 1; }
        }
        function ftouchstart(e) {
          let istouch = e.type === "touchstart";
          if (shouldHandle(e, istouch)) {
            reset();
            let src = closestDraggable(e.target);
            if (src) {
              dragSource = src;
              ptDown = pointFrom(e, false, istouch);
              lastTouch = e;
            }
          }
        }
        function ftouchmove(e) {
          let istouch = e.type === "touchmove";
          if (shouldHandle(e, istouch)) {
            if (istouch && e.cancelable) { e.preventDefault(); }
            let target = getTarget(e, istouch);
            if (dragSource && !img && getDelta(e, istouch) > 10) { // dragThresholdPixels
              // create image
              if (img) { destroyImage(); }
              let src = dragSource;
              img = src.cloneNode(true);
              copyStyle(src, img);
              img.style.top = img.style.left = "-9999px";
              let rc = src.getBoundingClientRect(), pt = pointFrom(e, false, istouch);
              imgOffset = { x: pt.x - rc.left, y: pt.y - rc.top };
              img.style.opacity = "0.5";
              moveImage(e, istouch);
              document.body.appendChild(img);
              shadowon(target);
            }
            if (img && dragSource) {
              lastTouch = e;
              if (target !== lastTarget) {
                if (lastTarget) { shadowoff(lastTarget); }
                shadowon(target);
                lastTarget = target;
              }
              moveImage(e, istouch);
            }
          }
        }
        function ftouchend(e) {
          let istouch = e.type === "touchend";
          if (!(lastTouch && e.target && lastTarget)) {
            reset();
            return;
          }
          if (shouldHandle(e, istouch)) {
            if (!img) { dragSource = null; }
            destroyImage();
            if (dragSource) {
              if (e.type.indexOf("cancel") < 0) { fdrop(lastTarget); }
              reset();
            }
          }
        }
        function reset() {
          destroyImage();
          dragSource = null;
          lastTouch = null;
          lastTarget = null;
          ptDown = null;
        }
        function getDelta(e, touch = true) {
          if (!ptDown) { return 0; }
          const { x, y } = ptDown;
          const p = pointFrom(e, false, touch);
          return Math.sqrt((p.x - x)**2 + (p.y - y)**2);
        }
        function getTarget(e, touch = true) {
          let pt = pointFrom(e, false, touch), el = document.elementFromPoint(pt.x, pt.y);
          while (el && getComputedStyle(el).pointerEvents == "none") {
            el = el.parentElement;
          }
          return el;
        }
        function destroyImage() {
          if (img && img.parentElement) { img.parentElement.removeChild(img); }
          img = null;
        }
        function moveImage(e, touch = true) {
          requestAnimationFrame(() => {
            if (img) {
              let pt = pointFrom(e, true, touch), s = img.style;
              s.position = "absolute";
              s.pointerEvents = "none";
              s.zIndex = "999999";
              s.left = round(pt.x - imgOffset.x, 1) + "px";
              s.top = round(pt.y - imgOffset.y, 1) + "px";
            }
          });
        }
        function closestDraggable(element) {
          for (let e = element; e !== null; e = e.parentElement) {
            if (e.getAttribute("mydraggable") === "true") { return e; }
          }
          return null;
        }
      }
      window["main"] = main;
    </script>
